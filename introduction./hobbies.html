<!DOCTYPE html>
<html lang="en">
<head>
  <title>Gabrielle | Hobbies</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  
  <style>
    .carousel-item img { height: 500px; object-fit: cover; border-radius: 10px; }
    .content-card-large { padding: 40px !important; margin-bottom: 20px; }
    .lyrics-style { font-style: italic; color: #6a4c93; margin-top: 15px; font-weight: bold; }
    
    /* Comment Section Styling */
    .comment-box { border-radius: 15px; border: 1px solid #ddd; padding: 10px; margin-top: 15px; background: #f9f9f9; }
    .comment-list { text-align: left; max-height: 150px; overflow-y: auto; margin-top: 10px; padding: 0; list-style: none; }
    .comment-item { background: white; padding: 5px 12px; border-radius: 20px; margin-bottom: 5px; font-size: 0.9rem; border: 1px solid #eee; }
    .btn-purple { background-color: #6a4c93; color: white; border-radius: 20px; }
    .btn-purple:hover { background-color: #533a75; color: white; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-sm bg-dark navbar-dark sticky-top shadow">
  <div class="container-fluid">
    <ul class="navbar-nav mx-auto">
      <li class="nav-item"><a class="nav-link" href="index.html">Profile</a></li>
      <li class="nav-item"><a class="nav-link active" href="hobbies.html">Hobbies & Friends</a></li>
      <li class="nav-item"><a class="nav-link" href="resources.html">Resources</a></li>
      <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
    </ul>
  </div>
</nav>

<div id="app" class="container mt-5">
  <div class="row g-5">
    
    <div class="col-md-6" v-for="(section, key) in sections" :key="key">
      <div class="content-card content-card-large h-100 text-center shadow">
        <h2>{{ section.title }}</h2>
        
        <div :id="'carousel'+key" class="carousel slide themed-img overflow-hidden" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active"><img :src="section.img" class="d-block w-100" alt="photo"></div>
          </div>
        </div>

        <p class="lyrics-style">{{ section.caption }}</p>

        <div class="d-flex justify-content-center gap-2 mt-3">
          <button @click="section.likes++" class="btn btn-outline-danger rounded-pill">
            <i class="fas fa-heart"></i> {{ section.likes }}
          </button>
        </div>

        <div class="comment-box">
          <div class="input-group mb-2">
            <input type="text" v-model="section.newComment" class="form-control rounded-pill" placeholder="Write a comment..." @keyup.enter="addComment(key)">
            <button class="btn btn-purple ms-2" @click="addComment(key)">Post</button>
          </div>
          
          <ul class="comment-list">
            <li v-for="comment in section.comments" class="comment-item">
              <i class="fas fa-user-circle text-muted me-2"></i> {{ comment }}
            </li>
          </ul>
        </div>
      </div>
    </div>

  </div>
</div>

<footer id="footer-app" class="header-footer-custom text-center py-4 mt-5">
  <p class="mb-0">© 2026 Gabrielle | WEBPROG Midterm</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const { createApp, reactive } = Vue

  createApp({
    setup() {
      const sections = reactive({
        bf: { 
          title: 'King of My Heart', 
          img: 'bf1.jpg', 
          caption: '"And all at once, you are the one I\'ve been waiting for..."',
          likes: 0, newComment: '', comments: [] 
        },
        friends: { 
          title: 'Support System', 
          img: 'friends1.jpg', 
          caption: '"From the friends who know my history to the ones just joining the narrative"',
          likes: 0, newComment: '', comments: [] 
        },
        pets: { 
          title: 'Furry Loves', 
          img: 'pets1.jpg', 
          caption: '"Not a Demodog"',
          likes: 0, newComment: '', comments: [] 
        },
        creative: { 
          title: 'Creative Corner', 
          img: 'creative1.jpg', 
          caption: '"I Can Make The Whole Place Shimmer"',
          likes: 0, newComment: '', comments: [] 
        }
      })

      const addComment = (key) => {
        if (sections[key].newComment.trim() !== '') {
          sections[key].comments.unshift(sections[key].newComment);
          sections[key].newComment = ''; // Clear the input
        }
      }

      return { sections, addComment }
    }
  }).mount('#app')
</script>

</body>
</html>
